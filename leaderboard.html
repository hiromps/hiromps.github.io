    <div class="leaderboard-container">
        <h1 class="page-title">VALORANT リーダーボード（地域別）</h1>
        <div class="region-selector">
            <h2>地域選択</h2>
            <div class="region-buttons">
                <button class="region-button active" data-region="ap">アジア太平洋</button>
                <button class="region-button" data-region="eu">ヨーロッパ</button>
                <button class="region-button" data-region="na">北アメリカ</button>

            </div>
        </div>
        
        <div class="leaderboard-table">
            <div class="table-header">
                <h3 id="regionTitle">アジア太平洋 - リーダーボード</h3>
            </div>
            
            <div id="leaderboardContent">
                <!-- リーダーボード内容がここに表示されます -->

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/hamburger-menu.js"></script>
    <script>
        let currentRegion = 'ap';

        const regionNames = {
            'ap': 'アジア太平洋',
            'eu': 'ヨーロッパ',
            'na': '北アメリカ',
            'kr': '韓国'
        };

        // v3リーダーボードAPIは競合ティアを数値ID(0-27)で返す(valorant-api.comの競合ティア定義に準拠)。
        // 表示用のランク名に変換するための固定マッピング。
        const TIER_ID_TO_NAME = {
            3: 'Iron 1', 4: 'Iron 2', 5: 'Iron 3',
            6: 'Bronze 1', 7: 'Bronze 2', 8: 'Bronze 3',
            9: 'Silver 1', 10: 'Silver 2', 11: 'Silver 3',
            12: 'Gold 1', 13: 'Gold 2', 14: 'Gold 3',
            15: 'Platinum 1', 16: 'Platinum 2', 17: 'Platinum 3',
            18: 'Diamond 1', 19: 'Diamond 2', 20: 'Diamond 3',
            21: 'Ascendant 1', 22: 'Ascendant 2', 23: 'Ascendant 3',
            24: 'Immortal 1', 25: 'Immortal 2', 26: 'Immortal 3',
            27: 'Radiant'
        };

        function getTierName(tierId) {
            return TIER_ID_TO_NAME[tierId] || 'Unranked';
        }

        async function loadLeaderboard(region) {
            const content = document.getElementById('leaderboardContent');
            const title = document.getElementById('regionTitle');
            
            content.innerHTML = '<div class="loading">リーダーボードを取得中...</div>';
            title.textContent = `${regionNames[region]} - リーダーボード`;
            
            try {
                const data = await fetchLeaderboard(region);

                if (!data || !data.data || !data.data.players) {
                    throw new Error('リーダーボードデータの取得に失敗しました');
                }

                displayLeaderboard(data.data.players);

            } catch (error) {
                console.error('リーダーボード取得エラー:', error);
                const reason = error && error.name === 'AbortError'
                    ? 'リクエストがタイムアウトしました'
                    : (error && error.message) || '不明なエラー';
                content.innerHTML = `<div class="error">リーダーボードの取得に失敗しました。しばらく後にお試しください。<br><small>(${reason})</small></div>`;
            }
        }
        
        function displayLeaderboard(players) {
            const content = document.getElementById('leaderboardContent');
            
            if (!players || players.length === 0) {
                content.innerHTML = '<div class="error">リーダーボードデータが見つかりません。</div>';
                return;
            }
            
            const playersHTML = players.map((player) => {
                const rank = player.leaderboard_rank || 0;
                const isTop3 = rank > 0 && rank <= 3;
                const rankClass = isTop3 ? 'top-3' : '';
                const tierName = getTierName(player.tier);

                return `
                    <div class="player-row">
                        <div class="rank-number ${rankClass}">#${rank}</div>
                        <div class="player-info">
                            <img src="${getRankImageUrl(tierName)}"
                                 alt="${tierName}" class="rank-icon"
                                 onerror="this.src='assets/images/ranks/unranked.png'">
                            <div class="player-details">
                                <div class="player-name">${player.name || 'Unknown'}</div>
                                <div class="player-tag">#${player.tag || '0000'}</div>
                            </div>
                        </div>
                        <div class="rank-name">${tierName}</div>
                        <div class="rr-points">${player.rr || 0}RR</div>
                    </div>
                `;
            }).join('');
            
            content.innerHTML = playersHTML;
        }
        
        // 地域選択
        document.querySelectorAll('.region-button').forEach(button => {
            button.addEventListener('click', function() {
                // アクティブ状態を更新
                document.querySelectorAll('.region-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                // 新しい地域のリーダーボードを読み込み
                currentRegion = this.getAttribute('data-region');
                loadLeaderboard(currentRegion);
            });
        });
        
        // 初期読み込み
        loadLeaderboard(currentRegion);
    </script>
