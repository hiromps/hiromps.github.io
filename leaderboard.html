<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リーダーボード - VALORANT Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="accessibility.css">
    <style>
         /* メインコンテンツのレスポンシブ対応 */
         .leaderboard-container {
             max-width: 1200px;
             margin: 2rem auto;
             padding: 0 1rem;
         }
         
         .region-selector {
             background: rgba(15, 25, 35, 0.9);
             border-radius: 12px;
             padding: 1.5rem;
             margin-bottom: 2rem;
             backdrop-filter: blur(10px);
             border: 1px solid rgba(255, 70, 85, 0.3);
         }
         
         .region-selector h2 {
             color: #ff4655;
             margin-bottom: 1rem;
             font-size: 1.5rem;
         }
         
         .region-buttons {
             display: flex;
             gap: 0.5rem;
             flex-wrap: wrap;
         }
         
         .region-button {
             background: rgba(255, 70, 85, 0.1);
             border: 1px solid rgba(255, 70, 85, 0.3);
             color: #fff;
             padding: 0.75rem 1.5rem;
             border-radius: 8px;
             cursor: pointer;
             transition: all 0.3s ease;
             font-weight: 600;
             flex: 1;
             min-width: 120px;
         }
         
         .region-button:hover {
             background: rgba(255, 70, 85, 0.2);
             transform: translateY(-2px);
         }
         
         .region-button.active {
             background: #ff4655;
             box-shadow: 0 4px 12px rgba(255, 70, 85, 0.4);
         }
         
         .leaderboard-table {
             background: rgba(15, 25, 35, 0.9);
             border-radius: 12px;
             padding: 1.5rem;
             backdrop-filter: blur(10px);
             border: 1px solid rgba(255, 70, 85, 0.3);
             margin-bottom: 2rem;
         }
         
         .table-header h3 {
             color: #ff4655;
             margin-bottom: 1.5rem;
             font-size: 1.5rem;
         }
         
         .loading, .error {
             text-align: center;
             padding: 2rem;
             color: #ccc;
             font-size: 1.1rem;
         }
         
         .error {
             color: #ff6b6b;
         }
         
         .player-row {
             display: grid;
             grid-template-columns: 60px 1fr auto auto;
             gap: 1rem;
             align-items: center;
             padding: 1rem;
             border-bottom: 1px solid rgba(255, 255, 255, 0.1);
             transition: all 0.3s ease;
         }
         
         .player-row:hover {
             background: rgba(255, 70, 85, 0.1);
             border-radius: 8px;
         }
         
         .player-row:last-child {
             border-bottom: none;
         }
         
         .rank-number {
             font-size: 1.2rem;
             font-weight: bold;
             color: #fff;
             text-align: center;
         }
         
         .rank-number.top-3 {
             color: #ffd700;
             text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
         }
         
         .player-info {
             display: flex;
             align-items: center;
             gap: 0.75rem;
         }
         
         .rank-icon {
             width: 40px;
             height: 40px;
             border-radius: 8px;
         }
         
         .player-details {
             flex: 1;
         }
         
         .player-name {
             font-weight: 600;
             color: #fff;
             font-size: 1rem;
         }
         
         .player-tag {
             color: #ccc;
             font-size: 0.85rem;
             margin-top: 0.25rem;
         }
         
         .rank-name {
             font-weight: 600;
             color: #fff;
             text-align: right;
         }
         
         .rr-points {
             font-weight: bold;
             color: #ff4655;
             text-align: right;
             min-width: 60px;
         }
         
         .update-info {
             text-align: center;
             color: #888;
             font-size: 0.9rem;
         }
         
         /* モバイル対応 */
         @media screen and (max-width: 768px) {
             .leaderboard-container {
                 margin: 1rem auto;
                 padding: 0 0.75rem;
             }
             
             .region-selector {
                 padding: 1rem;
                 margin-bottom: 1.5rem;
             }
             
             .region-selector h2 {
                 font-size: 1.25rem;
                 margin-bottom: 0.75rem;
             }
             
             .region-buttons {
                 gap: 0.375rem;
             }
             
             .region-button {
                 padding: 0.625rem 1rem;
                 font-size: 0.9rem;
                 min-width: 100px;
             }
             
             .leaderboard-table {
                 padding: 1rem;
                 margin-bottom: 1.5rem;
             }
             
             .table-header h3 {
                 font-size: 1.25rem;
                 margin-bottom: 1rem;
             }
             
             .player-row {
                 grid-template-columns: 50px 1fr auto;
                 gap: 0.75rem;
                 padding: 0.875rem 0.5rem;
             }
             
             .rank-number {
                 font-size: 1rem;
             }
             
             .rank-icon {
                 width: 35px;
                 height: 35px;
             }
             
             .player-name {
                 font-size: 0.9rem;
             }
             
             .player-tag {
                 font-size: 0.8rem;
             }
             
             .rank-name {
                 display: none; /* モバイルでランク名を非表示 */
             }
             
             .rr-points {
                 font-size: 0.9rem;
                 min-width: 50px;
             }
         }
         
         @media screen and (max-width: 480px) {
             .leaderboard-container {
                 padding: 0 0.5rem;
             }
             
             .region-selector {
                 padding: 0.875rem;
             }
             
             .region-buttons {
                 gap: 0.25rem;
             }
             
             .region-button {
                 padding: 0.5rem 0.75rem;
                 font-size: 0.85rem;
                 min-width: 80px;
                 flex: 1;
             }
             
             .leaderboard-table {
                 padding: 0.875rem;
             }
             
             .table-header h3 {
                 font-size: 1.1rem;
             }
             
             .player-row {
                 grid-template-columns: 40px 1fr auto;
                 gap: 0.5rem;
                 padding: 0.75rem 0.25rem;
             }
             
             .rank-number {
                 font-size: 0.9rem;
             }
             
             .rank-icon {
                 width: 30px;
                 height: 30px;
             }
             
             .player-info {
                 gap: 0.5rem;
             }
             
             .player-name {
                 font-size: 0.85rem;
                 line-height: 1.2;
             }
             
             .player-tag {
                 font-size: 0.75rem;
             }
             
             .rr-points {
                 font-size: 0.85rem;
                 min-width: 45px;
             }
             
             .loading, .error {
                 padding: 1.5rem 1rem;
                 font-size: 1rem;
             }
         }
    </style>
</head>
     <body>
     <div class="background"></div>
     
     <header class="app-header">
        <div class="header-content">
            <div class="nav-buttons">
                <a href="/" id="showOverlayModeLink" class="header-button">OBSオーバーレイ</a>
                <a href="./valorant-stats-tracker/" id="showTrackerModeLink" class="header-button">戦績トラッカー</a>
                <a href="/match-history.html" class="header-button">マッチ履歴</a>
                <a href="/skins-database.html" class="header-button">スキンDB</a>
                <a href="/leaderboard.html" class="header-button active">ランキング</a>
            </div>
            
            <!-- ハンバーガーメニューボタン -->
            <div class="hamburger-menu" id="hamburgerMenu">
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>
        </div>
        
        <!-- モバイル用ナビゲーション -->
        <div class="mobile-nav" id="mobileNav">
            <div class="mobile-nav-buttons">
                <a href="/" class="header-button">OBSオーバーレイ</a>
                <a href="./valorant-stats-tracker/" class="header-button">戦績トラッカー</a>
                <a href="/match-history.html" class="header-button">マッチ履歴</a>
                <a href="/skins-database.html" class="header-button">スキンDB</a>
                <a href="/leaderboard.html" class="header-button active">ランキング</a>
            </div>
        </div>
    </header>
    
    <div class="background"></div>
    
    <div class="leaderboard-container">
        <div class="region-selector">
            <h2>地域選択</h2>
            <div class="region-buttons">
                <button class="region-button active" data-region="ap">アジア太平洋</button>
                <button class="region-button" data-region="eu">ヨーロッパ</button>
                <button class="region-button" data-region="na">北アメリカ</button>
                <button class="region-button" data-region="kr">韓国</button>
            </div>
        </div>
        
        <div class="leaderboard-table">
            <div class="table-header">
                <h3 id="regionTitle">アジア太平洋 - リーダーボード</h3>
            </div>
            
            <div id="leaderboardContent">
                <!-- リーダーボード内容がここに表示されます -->
            </div>
        </div>
        
        <div class="update-info">
            <p>※ リーダーボードは定期的に更新されます</p>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/hamburger-menu.js"></script>
    <script>
        let currentRegion = 'ap';
        
        const regionNames = {
            'ap': 'アジア太平洋',
            'eu': 'ヨーロッパ', 
            'na': '北アメリカ',
            'kr': '韓国'
        };
        
        async function loadLeaderboard(region) {
            const content = document.getElementById('leaderboardContent');
            const title = document.getElementById('regionTitle');
            
            content.innerHTML = '<div class="loading">リーダーボードを取得中...</div>';
            title.textContent = `${regionNames[region]} - リーダーボード`;
            
            try {
                const data = await fetchLeaderboard(region);
                
                if (!data || !data.players) {
                    throw new Error('リーダーボードデータの取得に失敗しました');
                }
                
                displayLeaderboard(data.players);
                
            } catch (error) {
                console.error('リーダーボード取得エラー:', error);
                content.innerHTML = '<div class="error">リーダーボードの取得に失敗しました。しばらく後にお試しください。</div>';
            }
        }
        
        function displayLeaderboard(players) {
            const content = document.getElementById('leaderboardContent');
            
            if (!players || players.length === 0) {
                content.innerHTML = '<div class="error">リーダーボードデータが見つかりません。</div>';
                return;
            }
            
            const playersHTML = players.map((player, index) => {
                const rank = index + 1;
                const isTop3 = rank <= 3;
                const rankClass = isTop3 ? 'top-3' : '';
                
                return `
                    <div class="player-row">
                        <div class="rank-number ${rankClass}">#${rank}</div>
                        <div class="player-info">
                            <img src="${getRankImageUrl(player.currenttierpatched || 'Radiant')}" 
                                 alt="Rank Icon" class="rank-icon"
                                 onerror="this.src='assets/images/ranks/radiant.png'">
                            <div class="player-details">
                                <div class="player-name">${player.gameName || 'Unknown'}</div>
                                <div class="player-tag">#${player.tagLine || '0000'}</div>
                            </div>
                        </div>
                        <div class="rank-name">${player.currenttierpatched || 'レディアント'}</div>
                        <div class="rr-points">${player.rankedRating || player.ranking_in_tier || 0}RR</div>
                    </div>
                `;
            }).join('');
            
            content.innerHTML = playersHTML;
        }
        
        // 地域選択
        document.querySelectorAll('.region-button').forEach(button => {
            button.addEventListener('click', function() {
                // アクティブ状態を更新
                document.querySelectorAll('.region-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                // 新しい地域のリーダーボードを読み込み
                currentRegion = this.getAttribute('data-region');
                loadLeaderboard(currentRegion);
            });
        });
        
        // 初期読み込み
        loadLeaderboard(currentRegion);
    </script>
</body>
</html>
