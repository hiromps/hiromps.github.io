name = "valorant-proxy"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

# APIキーはここに書かず、以下のコマンドで secret として登録する:
#   wrangler pages secret put HENRIKDEV_API_KEY --project-name=valorant-proxy
#   wrangler pages secret put RIOT_API_KEY      --project-name=valorant-proxy
# ローカル開発では cloudflare-worker/.dev.vars に KEY=値 の形式で置く(gitignore済み)

# キャッシュ用 KV namespace。
# 主キャッシュは Cache API(エッジ)で、KV は「エッジをまたいで共有する価値が高く、
# 書き込み回数が積み上がらないもの」だけに使う = マッチ詳細と Riot の現行アクトID。
# (KVの書き込みは無料枠 1日1,000回で、Cloudflareアカウント全体の共有枠)
[[kv_namespaces]]
binding = "VALORANT_CACHE"
id = "ca07f85574414b6ab8899791335ba37c"

# 自前RR追跡用 D1 database。
# KVの1日1,000書き込み上限とは別枠(D1は無料枠で書き込み10万行/日)なので、
# RRの差分記録・試合ごとのRR履歴はこちらに置く。
# 適用: wrangler d1 execute valorant-rr --file=schema.sql --remote
[[d1_databases]]
binding = "VALORANT_RR"
database_name = "valorant-rr"
database_id = "21e006ee-4106-4c9a-8024-249ddb8173c0"
